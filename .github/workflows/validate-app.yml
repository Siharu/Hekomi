name: Validate Hekomi

on:
  push:
    branches: [main]
    paths:
      - 'server.mjs'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'assets/**'
      - 'render.yaml'
      - 'vercel.json'
      - '.github/workflows/validate-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server.mjs'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'icon.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'assets/**'
      - 'render.yaml'
      - 'vercel.json'
      - '.github/workflows/validate-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --no-audit --no-fund
      - name: Check backend and calendar JavaScript syntax
        run: |
          node --check server.mjs
          node --check lib/syoboi-calendar.mjs
          node --check assets/hekomi-calendar.js
      - name: Run calendar unit tests
        run: node --test tests/unit/syoboi-calendar.test.js
      - name: Check browser JavaScript syntax and required UI hooks
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const html = await fs.readFile('index.html', 'utf8');
          const server = await fs.readFile('server.mjs', 'utf8');
          const mascotJs = await fs.readFile('assets/hekomi-chan.js', 'utf8');
          const calendarJs = await fs.readFile('assets/hekomi-calendar.js', 'utf8');
          new Function(mascotJs);
          new Function(calendarJs);
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          const appScripts = scripts.filter(match => !/application\/(?:ld\+json|json)/i.test(match[1]));
          if (!appScripts.length) throw new Error('No inline application script found in Hekomi HTML.');
          for (const script of appScripts) new Function(script[2]);
          for (const required of ['id="malView"', 'id="mangaView"', 'id="calendarView"', 'data-route-link="calendar"', 'Weekly airing schedule', 'animeCatalogGrid', 'mangaCatalogGrid', 'airingCatalogGrid', 'showcaseAddButton', 'og:image', 'application/ld+json', 'catalogDiscoverButton', 'filterGenre', 'function editLocalAnime', 'animeListCardMarkup', 'anime-list-grid', 'genreTransitionTheme', 'data-genre-transition', 'data-transition-image', 'hk-transition-poster', 'id="landing"', 'id="hkCalendarTitle"', '--hk-accent-ink', '.home-visual', 'assets/hekomi-chan.js', 'id="hekomiChanCanvas"', 'id="hekomiChanMessage"', '.home-mascot', 'HEKOMI-CHAN', '#hekomiCompanion', 'hekomi-zzz', 'body[data-page="home"] .home-hero{grid-template-columns:minmax(0,1fr)}', 'backdrop-filter:blur(22px) saturate(150%)', '#hkAuthBackdrop{display:none}', 'genreSoundToggle', 'id="hkCalWeekTotal"', 'id="hkCalWeekRange"', 'id="hkCalDayNav"', 'id="hkCalFilters"', 'id="hkCalImages"', 'data-calendar-filter="watching"', 'data-catalog-action="both"', 'data-mal-search-action="both"', 'Oldest by airing date', 'Oldest by added PTW list', 'Recently completed list', 'Recently finished airing list', 'Recently added to MAL list', 'Last updated by you list']) {
            if (!html.includes(required)) throw new Error('Required Hekomi UI/SEO hook is missing: ' + required);
          }
          for (const required of ['class HekomiWanderer', "root.id='hekomiCompanion'", 'drawSprite', 'drawWalkLegs', 'drawSleepArms', 'findSpot()', 'sleep(now)', 'dialogueForPage()', 'setInteractable()', 'requestAnimationFrame', 'prefers-reduced-motion']) {
            if (!mascotJs.includes(required)) throw new Error('Hekomi-chan roaming behavior is missing: ' + required);
          }
          for (const required of ['detail-art-backdrop', 'data-detail-genre', 'detailVisualStyles', 'MEDIA_PROFILE_FIELDS', 'MEDIA_PROFILE_SEARCH_QUERY', 'creditsHtml', 'authors,artists,characters,staff,relations', '/api/catalog/profile-search']) {
            if (!server.includes(required)) throw new Error('Required Hekomi detail-page hook is missing: ' + required);
          }
          const lines = html.split('\n').map(line => line.trimStart());
          const goodThemeListener = lines.some(line => line.startsWith("$$('#modalRoot [data-theme-choice]').forEach"));
          const brokenThemeListener = lines.some(line => line.startsWith("$('#modalRoot [data-theme-choice]').forEach"));
          if (!goodThemeListener || brokenThemeListener) throw new Error('Appearance choices must bind each theme option using the all-match selector.');
          NODE
      - name: Smoke test server
        shell: bash
        run: |
          PORT=4173 npm start > /tmp/hekomi-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/health >/tmp/hekomi-health.json; then break; fi
            sleep 1
          done
          if ! grep -q '"ok":true' /tmp/hekomi-health.json; then
            cat /tmp/hekomi-server.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:4173/api/mal/auth/status | grep -q '"configured":false'
          curl -fsS http://127.0.0.1:4173/ >/tmp/hekomi-home.html
          grep -q 'Hekomi' /tmp/hekomi-home.html
          curl -fsS 'http://127.0.0.1:4173/api/catalog/profile-search?title=One%20Piece&kind=manga' >/tmp/hekomi-profile-search.json
          grep -q '"results"' /tmp/hekomi-profile-search.json
          curl -fsS http://127.0.0.1:4173/calendar >/tmp/hekomi-calendar.html
          grep -q 'Weekly airing schedule' /tmp/hekomi-calendar.html
          curl -fsS http://127.0.0.1:4173/assets/hekomi-chan.js >/tmp/hekomi-chan.js
          grep -q 'class HekomiWanderer' /tmp/hekomi-chan.js
          curl -fsS http://127.0.0.1:4173/robots.txt >/tmp/hekomi-robots.txt
          grep -q 'Sitemap:' /tmp/hekomi-robots.txt
